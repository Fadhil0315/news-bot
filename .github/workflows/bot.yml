name: Geo News Bot

on:
  schedule:
    # Morning Brief (compensated for observed +3h drift)
    # Should land around 8:15 AM IST
    - cron: "45 23 * * *"

    # Normal alerts every 3 hours, 24/7
    - cron: "0 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Morning Brief
        if: github.event.schedule == '45 23 * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python aireport.py morning

      - name: Run Normal Alerts
        if: github.event.schedule == '0 */3 * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python aireport.py normal

      - name: Save memory
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add state/last_headlines.txt
          git diff --cached --quiet || git commit -m "Update headline memory"
          git push